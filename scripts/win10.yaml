services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "10"
      DISK_SIZE: "2T"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      USERNAME: "AgentUser"
      PASSWORD: "AgentPassword1"
      TIMEZONE: "UTC"
      REGION: "en-US"
      KEYBOARD: "en-US"
      HOSTNAME: "Workspace"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
      - 4444:4444
      - 2222:22
    volumes:
      - ./windows10-storage:/storage
    restart: "no"
    stop_grace_period: 2m
